<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="./style/style.css">
    <style>
        .layout{
            background-color: #f5f6f8;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-columns:var(--aside-width) minmax(0, 1fr) ;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: 
                "header header"
                "aside main"
                "footer footer";
        }
    
        .site-header{
            /* background-color: rgba(255, 255, 0, 0.15); */
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-xs);
            background: rgba(255, 255, 0, 0.15);
        }
        .site-aside{
            /* background-color: rgba(255, 0, 0, 0.15); */
            grid-area: aside;
            padding: var(--space-md);
            background: rgba(255, 0, 0, 0.15 );
        }
        .site-main{
            /* background-color: rgba(0, 255, 0, 0.15); */
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            padding: var(--space-md);
            background: rgba(0, 255, 0, 0.15);
        }
        .site-footer{
            /* background-color: rgba(0, 0, 255, 0.3); */
            grid-area: footer;
            padding: var(--space-md);
            background: rgba(0, 0, 255, 0.3);
        }

        .header-actions{
            display: flex;
            gap: var(--space-sm);
        }
        .site-nav ul{
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .site-nav a{
            display: block;
            padding: var(--space-sm) var(--space-md);
            color: var(--color-text);
            text-decoration: none;
            border-radius: var(--radius-sm);
        }
        .todo-form{
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .form-row{
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .form-row label{
            width: 100px;
            flex-shrink: 0;
        }
        .form-row input{
            flex: 1;
            padding: var(--space-xs) var(--space-sm);
            font-size: 16px;
        }
        .todo-article{
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .todo-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .todo-header h3{
            margin: 0;
        }
        .todo-actions{
            display: flex;
            gap: var(--space-sm);
        }
        .todo-list{
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .todo-list li{
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm);
            border-bottom: 1px solid var(--color-border);
        }
        .todo-list li label{
            flex: 1;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="layout">
        <header class="site-header">
            <img src="./icons/logo.jpg" alt="web logo" height="80" width="80">
            <section class="header-actions">
                <button type="button">sign in</button>
                <button type="button">sign up</button>
            </section>
        </header>
        <aside class="site-aside">
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Study.html">Study</a></li>
                    <li><a href="Mine.html">Mine</a></li>
                </ul>
            </nav>
        </aside>
        <main class="site-main">
            <form class="todo-form" action="plan">
                <section class="form-row">
                    <label for="task">Add task:</label>
                    <input id="task" type="text" placeholder="please input task">
                    <button type="button" onclick="alert('呦吼~开饭喽!')">Add</button>
                </section>
                <section class="form-row">
                    <label for="search">Search task:</label>
                    <input id="search" type="text" placeholder="please input search content">
                    <button type="">Search</button>
                </section>
            </form>
            <article class="todo-article">
                <section class="todo-header">
                    <h3>Task list:</h3>
                    <section class="todo-actions">
                        <button type="button">Batch Delete</button>
                        <button type="button">Update</button>
                    </section>
                </section>

                <ul class="todo-list">
                    <li>
                        <input type="checkbox" id="do-1">
                        <label for="do-1">Task1</label>
                        <button type="button">x</button>
                    </li>
                    <li>
                        <input type="checkbox" id="do-2" checked>
                        <label for="do-2">Task2</label>
                        <button type="button">x</button>
                    </li>
                    <li>
                        <input type="checkbox" id="do-3">
                        <label for="do-3">Task3</label>
                        <button type="button">x</button>
                    </li>
                </ul>
            </article>
        </main>
        <footer class="site-footer">
            <address><a href="https://github.com/Neo0385/TodoList.git">My GitHub</a></address>
        </footer>
    </div>
    
</body>
</html>
