<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="./style/style.css">
    <style>
        .layout{
            background-color: #f5f6f8;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            grid-template-columns:var(--aside-width) minmax(0, 1fr) ;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: 
                "header header"
                "aside main"
                "footer footer";
        }
    
        .site-header{
            /* background-color: rgba(255, 255, 0, 0.15); */
            /* ---------- 1. 布局定位 ---------- */
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            /* ---------- 2. 尺寸盒模型 ---------- */
            padding: var(--space-xs);
            /* ---------- 4. 视觉修饰 ---------- */
             /* 白色表面，与 main 的浅灰形成层次 */
            background: var(--color-surface);
            /* 底部一条细边框，把 header 和下方内容分开 */
             border-bottom: 1px solid var(--color-border);
            
        }
        .site-aside{
            /* background-color: rgba(255, 0, 0, 0.15); */
                /* ---------- 1. 布局定位 ---------- */
            grid-area: aside;
             /* ---------- 2. 尺寸盒模型 ---------- */
            padding: var(--space-md);
            /* ---------- 4. 视觉修饰 ---------- */
            background: var(--color-surface);
            /* 右侧一条细边框，分隔 aside 和 main */
            border-right: 1px solid var(--color-border);
        }
        .site-main{
            /* background-color: rgba(0, 255, 0, 0.15); */
            /* ---------- 1. 布局定位 ---------- */
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            /* ---------- 2. 尺寸盒模型 ---------- */
            padding: var(--space-md);
                /* ---------- 4. 视觉修饰 ---------- */
    /* 不设 background，露出 .layout 的浅灰底，让主区域和白色框架区分开 */
            /* background: rgba(0, 255, 0, 0.15); */
        }
        .site-footer{
            /* background-color: rgba(0, 0, 255, 0.3); */
            /* ---------- 1. 布局定位 ---------- */
            grid-area: footer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            /* ---------- 2. 尺寸盒模型 ---------- */
            padding: var(--space-md);
            /* ---------- 3. 文本排版 ---------- */
            font-size: 14px;
             /* ---------- 4. 视觉修饰 ---------- */
            background: var(--color-surface);
            /* 顶部一条细边框，分隔 footer 和上方内容 */
             border-top: 1px solid var(--color-border);

        }

        .header-actions{
            display: flex;
            gap: var(--space-sm);
        }
        .site-nav ul{
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .site-nav a{
            display: block;
            padding: var(--space-sm) var(--space-md);
            color: var(--color-text);
            text-decoration: none;
            border-radius: var(--radius-sm);
        }
        .todo-form{
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .form-row{
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        .form-row label{
            width: 100px;
            flex-shrink: 0;
        }
        .form-row input{
            flex: 1;
            padding: var(--space-xs) var(--space-sm);
            font-size: 16px;
        }
        .todo-article{
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        .todo-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .todo-header h3{
            margin: 0;
        }
        .todo-actions{
            display: flex;
            gap: var(--space-sm);
        }
        .todo-list{
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .todo-list li{
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm);
            border-bottom: 1px solid var(--color-border);
        }
        .todo-list li label{
            flex: 1;
            cursor: pointer;
        }
        .site-footer a{
            color: var(--color-primary);
            text-decoration: none;
        }
        .site-footer a:hover{
            text-decoration: underline;
        }
        button{
            padding: 6px var(--space-md);

            font-size: 14px;
            color: #fff;
            cursor: pointer;

            background: var(--color-primary);
            border: 1px solid var(--color-primary);
            border-radius: var(--radius-sm);

            transition: background-color 0.15s ease,
                        border-color 0.15 ease;
        }
        button:hover{
            background: var(--color-primary-hover);
            border-color: var(--color-primary-hover);
        }

        .form-row input{
            padding: var(--space-xs) var(--space-sm);

            font-size: 16px;
            color: var(--color-text);

            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);

            transition: border-color 0.15s ease,
                        box-shadow 0.15s ease;
        }
        .form-row input:focus{
            /* 去掉浏览器默认的黑色轮廓 */
            outline: none;
            border-color: var(--color-primary);
            /* 3px 淡蓝色光晕，让聚焦更明显 */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        /* ---------- 8.3 导航链接悬停 ---------- */
        .site-nav a:hover {
    /* 悬停时浅灰背景，提示当前指向哪一项 */
            background: var(--color-bg);
        }
        /* ---------- 8.4 任务项 ---------- */
        .todo-list li {
            /* 加圆角，让悬停背景看起来不突兀 */
            border-radius: var(--radius-sm);

            /* 背景色变化时平滑过渡 */
            transition: background-color 0.15s ease;
        }
        .todo-list li:hover {
            /* 悬停时整行浅灰 */
            background: var(--color-bg);
        }
        /* 勾选后的任务：加删除线 + 文字变灰 */
        /* 用 + 相邻兄弟选择器：选"被勾选的 checkbox 后面紧挨着的 label" */
        /* DOM 顺序必须是 input 在前、label 紧跟其后，中间不能插其他元素 */
        .todo-list input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: var(--color-text-muted);
        }
        /* 任务里的删除按钮：小号、透明底、悬停变红 */
        .todo-list li button {
            /* 尺寸盒模型 */
            padding: 2px 8px;

            /* 文本排版 */
            font-size: 12px;

            /* 视觉修饰 */
            background: transparent;
            color: var(--color-text-muted);
            border: 1px solid transparent;
        }
        /* 删除按钮悬停：浅红底、红字、红边 */
        .todo-list li button:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }
    </style>
</head>
<body>
    <div class="layout">
        <header class="site-header">
            <img src="./icons/logo.jpg" alt="web logo" height="80" width="80">
            <section class="header-actions">
                <button type="button">sign in</button>
                <button type="button">sign up</button>
            </section>
        </header>
        <aside class="site-aside">
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Study.html">Study</a></li>
                    <li><a href="Mine.html">Mine</a></li>
                </ul>
            </nav>
        </aside>
        <main class="site-main">
            <form class="todo-form" action="plan">
                <section class="form-row">
                    <label for="task">Add task:</label>
                    <input id="task" type="text" placeholder="please input task">
                    <button type="button" onclick="alert('呦吼~开饭喽!')">Add</button>
                </section>
                <section class="form-row">
                    <label for="search">Search task:</label>
                    <input id="search" type="text" placeholder="please input search content">
                    <button type="">Search</button>
                </section>
            </form>
            <article class="todo-article">
                <section class="todo-header">
                    <h3>Task list:</h3>
                    <section class="todo-actions">
                        <button type="button">Batch Delete</button>
                        <button type="button">Update</button>
                    </section>
                </section>

                <ul class="todo-list">
                    <li>
                        <input type="checkbox" id="do-1">
                        <label for="do-1">Task1</label>
                        <button type="button">x</button>
                    </li>
                    <li>
                        <input type="checkbox" id="do-2" checked>
                        <label for="do-2">Task2</label>
                        <button type="button">x</button>
                    </li>
                    <li>
                        <input type="checkbox" id="do-3">
                        <label for="do-3">Task3</label>
                        <button type="button">x</button>
                    </li>
                </ul>
            </article>
        </main>
        <footer class="site-footer">
            <small>遵循MIT license,此站仅为练习。开源fighting!</small>
            <address><a href="https://github.com/Neo0385/TodoList.git">My GitHub</a></address>
        </footer>
    </div>
    
</body>
</html>
